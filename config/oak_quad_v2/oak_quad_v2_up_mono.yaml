%YAML:1.0

#common parameters
#imu_topic: "/imu"
imu: 1         
num_of_cam: 1

imu_topic: "/imu/data"

image0_topic: "/oak/left_w/image_raw"


output_path: "/home/orin3/missions/path/"

cam0_calib: "oak_mono_calib_400p_left_w.yaml"
cam1_calib: "oak_mono_calib_400p_rioak_monoak_mono_calib_400p_left_wo_calib_400p_left_wght.yaml"


image_width: 640
image_height: 400

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.
                        # 2  Don't know anything about extrinsic parameters. You don't need to give R,T. We will try to calibrate it. Do some rotation movement at beginning.                        
#If you choose 0 or 1, you should write down the following matrix.
#Rotation from camera frame to imu frame, imu^R_cam
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.00012654,  0.49775143,  0.86731972,  0.06193075, 
           0.99976653, -0.01867751,  0.01086482, -0.0013478,
           0.02160735,  0.8671186,  -0.49763286,  0.01785286,
           0.0000000,   0.0000000,   0.0000000,   1.0000000]



multiple_thread: 1
#feature traker paprameters
max_cnt: 100           #200   # max feature number in feature tracking
min_dist: 25                 # min distance between two features
freq: 30              #10    # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image
F_threshold: 1.0              # ransac threshold (pixel)
show_track: 1         #1     # publish tracking image as topic
flow_back: 1             # perform forward and backward optical flow to improve feature tracking accuracy
equalize: 1            #0     # if image is too dark or light, trun on equalize to find enough features
fisheye: 0             #0     # if using fisheye, trun on it. A circle mask will be loaded to remove edge noisy points
use_fast: 1                   # if it equals to 1, we extract and track fast feature, otherwise we use GFTT from opencv
use_rgbd: 0          #0     # if using rgbd camera, turn on it. Depth residuals will be added to sliding window optimization and initialization
min_fast_resp: 7              # min response of fast feature


#optimization parameters
max_solver_time: 0.02        # max solver itration time (ms), to guarantee real time
max_num_iterations: 4      #8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0       # keyframe selection threshold (pixel)
reproj_threshold: 5.0

#imu parameters       The more accurate parameters you provide, the better performance
acc_n: 0.0025309522         # accelerometer measurement noise standard deviation. #0.2
gyr_n: 0.00012633185          # gyroscope measurement noise standard deviation.     #0.05
acc_w: 0.00020018773682178493        # accelerometer bias random work noise standard deviation.  #0.02
gyr_w: 4.260517430489519e-06        # gyroscope bias random work noise standard deviation.     #4.0e-5
g_norm: 9.805       # gravity magnitude

#loop closure parameters
loop_closure: 1                    # start loop closure
fast_relocalization: 0             # useful in real-time and large project
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "/home/orin3/missions/pose_graph/" # save and load path
save_image: 0                   # save image in pose graph for visualization prupose; you can close this function by setting 0 

#unsynchronization parameters
estimate_td: 1                      # online estimate time offset between camera and imu
td :0.007835061382050281                           # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#rolling shutter parameters
# rolling_shutter: 0                      # 0: global shutter camera, 1: rolling shutter camera
# rolling_shutter_tr: 0.033               # unit: s. rolling shutter read out time per frame (from data sheet). 

#visualization parameters
# save_image: 0                   # save image in pose graph for visualization prupose; you can close this function by setting 0 
# visualize_imu_forward: 0        # output imu forward propogation to achieve low latency and high frequence results
# visualize_camera_size: 0.4      # size of camera marker in RVIZ
